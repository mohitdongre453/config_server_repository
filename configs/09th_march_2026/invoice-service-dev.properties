```properties
# Application Configuration
spring.application.name=invoice-service
server.port=8081

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/9th-march-2026
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis Configuration (Upstash)
spring.data.redis.host=sacred-bison-199957.upstash.io
spring.data.redis.port=6379
spring.data.redis.username=default
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Spring Cache
spring.cache.type=redis

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=info,metrics
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true

# Micrometer Distributed Tracing
management.tracing.sampling.probability=1.0

# Zipkin Server
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# OpenFeign Tracing
spring.cloud.openfeign.micrometer.enabled=true

# Logging
logging.file.name=logs/invoice-service.log
logging.pattern.level=%5p
logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
```
